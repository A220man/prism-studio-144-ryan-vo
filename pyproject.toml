[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-studio"
version = "1.0.0"
description = "Visual, example-driven guide to Claude Code — from basic concepts to advanced agents, with copy-paste templates that bring immediate value."
readme = "README.md"
license = {text = "MIT"}
authors = [
  {name = "Ryan Vo", email = "ryandtvo@gmail.com"}
]
maintainers = [
  {name = "Ryan Vo", email = "ryandtvo@gmail.com"}
]
keywords = ["claude-code", "ai", "ml", "developer-tools", "tutorial", "skills", "subagents", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.32.0",
  "pydantic==2.9.2",
  "pydantic-settings==2.6.1",
  "sqlalchemy==2.0.36",
  "alembic==1.13.3",
  "aiosqlite==0.20.0",
  "python-jose[cryptography]==3.3.0",
  "python-multipart==0.0.9",
  "httpx==0.28.1",
  "python-dotenv==1.0.1",
  "structlog==24.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0",
  "httpx==0.28.1",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]